services:
  - type: web
    name: space-consultant-ai-studio-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL          # Neon Postgres connection string
        sync: false
      - key: CORS_ORIGINS          # your Netlify URL, no trailing slash
        sync: false
